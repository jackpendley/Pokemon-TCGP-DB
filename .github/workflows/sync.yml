# Hosted sync (docs/hosting-roadmap.md §5.2, revised for CI live sync):
# fetch the live Pokémon Zone collection using stored auth, rebuild the
# pipeline artifacts, publish them to Supabase, and commit the refreshed
# collection.json — so the dashboard's Sync button refreshes real data
# without a terminal or a redeploy.
#
# Modes:
#   live (nightly schedule, repository_dispatch "sync" from the web app's remote
#         sync runner, and workflow_dispatch default): full sync against Pokémon Zone
#         using the PZ_AUTH_JSON secret (contents of data/sync/.auth.json).
#         Runs on the SELF-HOSTED runner (residential IP) — Cloudflare blocks
#         the PZ fetch from GitHub-hosted datacenter IPs (verified 2026-07-10).
#         The runner machine's system python3 must have the pipeline deps +
#         supabase + curl_cffi installed. If the runner is offline, runs queue
#         until it comes back.
#   skip (push to main, or workflow_dispatch mode=skip): rebuild + publish
#         from the committed collection.json only; no PZ auth needed. Runs on
#         ubuntu-latest.
#
# PZ auth lasts ~3–4 weeks. To refresh, locally run:
#   python3 scripts/sync_collection.py --curl-import
#   gh secret set PZ_AUTH_JSON < data/sync/.auth.json
#
# Secrets required: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, OWNER_USER_ID
# (the auth owner UUID printed by scripts/create_owner_user.py),
# PZ_AUTH_JSON (live mode), GH_PUSH_TOKEN (fine-grained PAT, contents:write,
# with branch-protection bypass — pushes the collection.json commit).

name: Sync & Publish

on:
  # Nightly at 02:00 America/Phoenix. Phoenix does not observe DST, so 09:00 UTC
  # is 2am year-round and no seasonal drift handling is needed.
  #
  # This exists because the gap, not the upstream, was the bigger problem: after
  # Ruler of the Skies released on 2026-07-29 nobody ran a sync for six days, so
  # the missing cards and Pokémon Zone's own outage were both invisible until
  # they were noticed by hand. A nightly run turns "the data is wrong and nobody
  # knows" into "the data is stale and the dashboard says so".
  #
  # GitHub disables a scheduled workflow after 60 days with no new commit on the
  # default branch, and the nightly run only commits when collection.json actually
  # changes — so a long enough quiet spell would switch off the very thing meant to
  # notice quiet spells. Any commit resets the timer (development counts, not just
  # syncs), which makes this unlikely rather than impossible. If the nightly run
  # stops appearing in the Actions tab, re-enable it there first.
  schedule:
    - cron: "0 9 * * *"
  repository_dispatch:
    types: [sync]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [live, skip]
        default: live
  push:
    branches: [main]

# One publish at a time; queue (don't cancel) so a publish never runs half-way.
concurrency:
  group: sync-publish
  cancel-in-progress: false

jobs:
  publish:
    # live → self-hosted (residential IP for the PZ fetch); skip → cloud.
    runs-on: ${{ (github.event_name == 'push' || github.event.inputs.mode == 'skip') && 'ubuntu-latest' || 'self-hosted' }}
    # A scheduled run is a live sync: same runner, same mode as a dispatch.
    env:
      MODE: ${{ github.event_name == 'push' && 'skip' || (github.event.inputs.mode || 'live') }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PUSH_TOKEN }}
          # Keep gitignored pipeline state (data/current/, data/sync/) between
          # runs on the self-hosted runner — the pre-sync snapshot, sync delta
          # (dashboard reveal popup), and sync history all depend on the
          # previous run's outputs, same as local runs. No-op on the ephemeral
          # cloud runner.
          clean: false

      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pipeline dependencies
        # Cloud runner only. The self-hosted runner uses its system python3,
        # which already has the pipeline deps + supabase + curl_cffi.
        if: runner.os == 'Linux'
        run: pip install jsonschema rapidfuzz beautifulsoup4 lxml requests supabase curl_cffi

      - name: Write Pokémon Zone auth
        if: env.MODE == 'live'
        env:
          PZ_AUTH_JSON: ${{ secrets.PZ_AUTH_JSON }}
        run: |
          mkdir -p data/sync
          printf '%s' "$PZ_AUTH_JSON" > data/sync/.auth.json

      - name: Run pipeline
        id: pipeline
        # Exit codes (scripts/run_recommendations.py): 0 ok, 2 completed with
        # review-queue items, 3 PZ auth expired (pipeline completed, collection
        # NOT refreshed). All three still publish; anything else fails.
        run: |
          args=""
          [ "$MODE" = "skip" ] && args="--skip-sync"
          set +e
          python3 scripts/run_recommendations.py $args
          code=$?
          set -e
          case $code in
            0) echo "outcome=ok" >> "$GITHUB_OUTPUT" ;;
            2) echo "outcome=review" >> "$GITHUB_OUTPUT" ;;
            3) echo "outcome=auth_expired" >> "$GITHUB_OUTPUT" ;;
            *) exit $code ;;
          esac

      - name: Rebuild card power scores
        run: python3 scripts/build_card_power_score.py

      - name: Publish to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          SYNC_OUTCOME: ${{ steps.pipeline.outputs.outcome }}
          SYNC_MODE: ${{ env.MODE }}
        run: python3 scripts/publish_to_supabase.py

      - name: Revalidate web cache
        # Invalidate the site's cached data (Cache Components DATA_TAG) so the
        # fresh publish is served immediately. Non-fatal: on failure the data
        # still refreshes on its own TTL. Skips cleanly until the secret is set.
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET unset; skipping cache revalidation."
            exit 0
          fi
          curl -fsS -X POST \
            "https://pokemon-tcgp-db-ten.vercel.app/api/revalidate" \
            -H "Authorization: Bearer $REVALIDATE_SECRET"

      - name: Commit refreshed collection
        # Publish already ran, so a push failure never leaves the dashboard
        # stale. [skip ci] keeps this data-only commit from re-triggering CI.
        if: env.MODE == 'live' && steps.pipeline.outputs.outcome != 'auth_expired'
        run: |
          git diff --quiet collection.json && exit 0
          git config user.name "sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add collection.json
          git commit -m "chore: live sync collection refresh [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
