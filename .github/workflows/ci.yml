name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        # Subset of requirements.txt actually exercised by the tests and validators.
        # The browser deps (playwright, curl-cffi) are optional and not imported on any
        # tested code path — curl-cffi has a `requests` fallback and playwright is
        # lazy-imported — so they're skipped here to keep CI fast and free of
        # system-library/binary requirements.
        run: pip install pytest jsonschema rapidfuzz beautifulsoup4 lxml requests

      - name: Test suite (pytest)
        # Includes the sync-matching and new-card/alt-art harnesses, which now
        # live in tests/ and are collected like any other module.
        run: python -m pytest tests/ -q

      - name: Reference-data integrity (schemas + ranges)
        run: |
          python scripts/validate_pack_sources.py
          python scripts/validate_pull_probability_model.py
          python scripts/validate_reprint_links.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Schema tests run against committed fixtures, and every cached read sits
      # behind a runtime bail (connection()/params) so prerender never touches
      # the (gitignored) pipeline artifacts. Reproduce this build locally with
      # `npm run build:ci` — see web/AGENTS.md.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Chromium only: the mobile project runs an iPhone viewport on Chromium
      # (see playwright.config.ts), so no second browser download is needed.
      - run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and starts the app itself. No pipeline
      # artifacts are present, so this also exercises the data-free render path.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
